<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>科技感首页 · 预览（非正式页面）</title>
<style>
:root{
  --bg:#03060d;
  --cyan:#22d3ee;
  --blue:#3b82f6;
  --violet:#8b5cf6;
  --text:#e8f6ff;
  --muted:#7d9ab8;
  --line:rgba(34,211,238,.28);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 背景层 ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}

/* 1. 粒子星座 */
#stars{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* 2. 透视网格地面 */
.grid{
  position:absolute;left:-50%;right:-50%;bottom:-30%;height:120%;
  background-image:
    linear-gradient(rgba(34,211,238,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.10) 1px,transparent 1px);
  background-size:64px 64px;
  transform:perspective(520px) rotateX(62deg);
  transform-origin:50% 100%;
  animation:gridPan 14s linear infinite;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 88%,#000 0%,transparent 78%);
          mask-image:radial-gradient(ellipse 70% 60% at 50% 88%,#000 0%,transparent 78%);
}
@keyframes gridPan{from{background-position:0 0;}to{background-position:0 64px;}}

/* 3. 光晕 */
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen;}
.glow.g1{width:52vw;height:52vw;left:-12vw;top:-16vw;background:radial-gradient(circle,rgba(34,211,238,.55),transparent 68%);animation:breathe 11s ease-in-out infinite;}
.glow.g2{width:46vw;height:46vw;right:-10vw;bottom:-14vw;background:radial-gradient(circle,rgba(139,92,246,.45),transparent 68%);animation:breathe 15s ease-in-out infinite reverse;}
.glow.g3{width:36vw;height:36vw;left:38%;top:26%;background:radial-gradient(circle,rgba(59,130,246,.30),transparent 70%);animation:breathe 19s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.32;transform:scale(1);}50%{opacity:.62;transform:scale(1.12);}}

/* 4. 扫描线 + 暗角 */
.scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
  opacity:.55;
}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(0,0,0,.72) 100%);}

/* ---------- 内容 ---------- */
.stage{
  position:relative;z-index:2;
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 20px 64px;
  text-align:center;
}

/* 顶部标签 */
.brand{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(125,154,184,.9);
  margin-bottom:26px;
  padding:6px 14px;
  border:1px solid rgba(34,211,238,.18);
  border-radius:999px;
  background:rgba(8,20,34,.42);
  backdrop-filter:blur(6px);
}
.brand i{
  width:6px;height:6px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

/* 提示语 */
.hint{
  margin:0 0 14px;
  font-size:13px;
  letter-spacing:.14em;
  color:rgba(125,154,184,.95);
  min-height:18px;
}
.hint span{color:var(--cyan);}

/* 时钟 */
.clock{position:relative;margin-bottom:6px;}
.clock .time{
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:clamp(46px,8.2vw,78px);
  line-height:1;
  letter-spacing:.06em;
  color:#eafcff;
  text-shadow:
    0 0 18px rgba(34,211,238,.55),
    0 0 48px rgba(34,211,238,.22),
    0 0 90px rgba(59,130,246,.18);
  font-variant-numeric:tabular-nums;
}
.clock .bar{
  width:100%;height:1px;margin:16px 0 12px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.65),rgba(139,92,246,.55),transparent);
}
.clock .date{
  font-size:13px;letter-spacing:.22em;color:rgba(163,196,222,.92);
}

/* 搜索 */
form.search{
  position:relative;
  width:min(480px,92vw);
  margin:30px auto 0;
  display:flex;
}
form.search input{
  flex:1;height:48px;
  padding:0 16px;
  font-size:14px;
  color:var(--text);
  background:rgba(7,17,30,.62);
  border:1px solid var(--line);
  border-right:0;
  border-radius:10px 0 0 10px;
  outline:none;
  backdrop-filter:blur(10px);
  transition:border-color .25s,box-shadow .25s,background .25s;
}
form.search input::placeholder{color:rgba(125,154,184,.75);}
form.search input:focus{
  border-color:rgba(34,211,238,.75);
  background:rgba(9,22,38,.82);
  box-shadow:0 0 0 1px rgba(34,211,238,.25),0 0 28px rgba(34,211,238,.22);
}
form.search button{
  width:88px;height:48px;
  border:0;cursor:pointer;
  font-size:14px;letter-spacing:.12em;
  color:#02121a;font-weight:600;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  border-radius:0 10px 10px 0;
  box-shadow:0 0 24px rgba(34,211,238,.35);
  transition:filter .2s,box-shadow .2s;
}
form.search button:hover{filter:brightness(1.12);box-shadow:0 0 34px rgba(34,211,238,.55);}

/* 热门搜索 */
.hot{
  margin-top:22px;
  font-size:13px;
  color:rgba(125,154,184,.95);
  display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;
  max-width:min(620px,94vw);
}
.hot b{font-weight:400;color:rgba(163,196,222,.9);}
.hot a{
  color:rgba(198,228,247,.92);
  text-decoration:none;
  padding:4px 12px;
  font-size:12.5px;
  border:1px solid rgba(34,211,238,.20);
  border-radius:999px;
  background:rgba(10,24,40,.5);
  transition:.22s;
}
.hot a:hover{
  color:#eafcff;
  border-color:rgba(34,211,238,.7);
  box-shadow:0 0 18px rgba(34,211,238,.28);
  transform:translateY(-1px);
}

/* 说明行 */
.meta{
  margin-top:18px;
  font-size:12.5px;
  line-height:2;
  color:rgba(125,154,184,.88);
  letter-spacing:.02em;
}
.meta a{color:rgba(34,211,238,.92);text-decoration:none;margin:0 4px;}
.meta a:hover{text-decoration:underline;}

.uptime{
  margin-top:20px;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:12px;
  letter-spacing:.08em;
  color:rgba(125,154,184,.8);
}
.uptime b{color:rgba(34,211,238,.9);font-weight:500;}

.footer{
  margin-top:10px;
  font-size:12px;
  color:rgba(103,130,155,.85);
}
.footer a{color:rgba(163,196,222,.9);text-decoration:none;margin-left:10px;}
.footer a:hover{color:var(--cyan);}

/* 分隔 */
.divider{
  width:min(520px,90vw);height:1px;margin:26px auto 0;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.18),transparent);
}

@media (max-width:640px){
  .stage{padding:40px 16px 52px;justify-content:flex-start;padding-top:64px;}
  .clock .time{font-size:clamp(40px,12vw,56px);}
  form.search{width:100%;}
  .grid{opacity:.6;}
  .glow{filter:blur(60px);}
}
@media (prefers-reduced-motion:reduce){
  .grid,.glow,.brand i{animation:none!important;}
}
</style>
</head>
<body>

<div class="bg">
  <canvas id="stars"></canvas>
  <div class="grid"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</div>

<main class="stage">
  <div class="brand"><i></i>XYPLAYER · 智能解析</div>

  <p class="hint" id="hint"><span>...</span>视频地址不能为空<span>...</span></p>

  <div class="clock">
    <div class="time" id="time">00:00:00</div>
    <div class="bar"></div>
    <div class="date" id="text">2026-01-01 星期一</div>
  </div>

  <form class="search" onsubmit="return false;">
    <input id="wd" type="text" placeholder="请输入视频名称或视频链接">
    <button type="submit">搜索</button>
  </form>

  <div class="hot">
    <b>热门搜索：</b>
    <a href="javascript:void(0)">飞驰人生</a>
    <a href="javascript:void(0)">流浪地球</a>
    <a href="javascript:void(0)">绿皮书</a>
    <a href="javascript:void(0)">疯狂的外星人</a>
    <a href="javascript:void(0)">更多...</a>
  </div>

  <div class="meta">解析支持：优酷、爱奇艺、腾讯、芒果、乐视、搜狐、MP4、M3U8、FLV等等</div>
  <div class="divider"></div>
  <div class="meta">友情链接：<a href="javascript:void(0)">官方网站</a><a href="javascript:void(0)">影视大全</a></div>

  <div class="uptime" id="sitetime"></div>
  <div class="footer">星源网络提供技术支持<a href="javascript:void(0)">免责声明</a></div>
</main>

<script>
/* ---------- 时钟 ---------- */
var week = ['星期天','星期一','星期二','星期三','星期四','星期五','星期六'];
var sitetime = '2026/05/22 14:30:00';

function zeroPadding(num, digit){
  var zero = '';
  for(var i=0;i<digit;i++){zero += '0';}
  return (zero + num).slice(-digit);
}
function SiteTime(t){
  var seconds=1000, minutes=seconds*60, hours=minutes*60, days=hours*24, years=days*365;
  var begin=new Date(t.replace(/-/g,'/'));
  var diff=new Date().getTime()-begin.getTime();
  var y=Math.floor(diff/years);
  var d=Math.floor(diff/days - y*365);
  var h=Math.floor((diff-(y*365+d)*days)/hours);
  var m=Math.floor((diff-(y*365+d)*days-h*hours)/minutes);
  var s=Math.floor((diff-(y*365+d)*days-h*hours-m*minutes)/seconds);
  document.getElementById('sitetime').innerHTML =
    '已运行 <b>'+y+'</b> 年 <b>'+d+'</b> 天 <b>'+h+'</b> 小时 <b>'+m+'</b> 分钟 <b>'+s+'</b> 秒';
}
function updateTime(){
  var cd = new Date();
  document.getElementById('time').textContent =
    zeroPadding(cd.getHours(),2)+':'+zeroPadding(cd.getMinutes(),2)+':'+zeroPadding(cd.getSeconds(),2);
  document.getElementById('text').textContent =
    zeroPadding(cd.getFullYear(),4)+'-'+zeroPadding(cd.getMonth()+1,2)+'-'+zeroPadding(cd.getDate(),2)+' '+week[cd.getDay()];
  SiteTime(sitetime);
}
updateTime();
setInterval(updateTime,1000);

/* ---------- 粒子星座 ---------- */
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cvs = document.getElementById('stars');
  var ctx = cvs.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W=0, H=0, pts=[], raf=null;
  var mouse = {x:-9999,y:-9999};

  function resize(){
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = W*dpr; cvs.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var target = Math.round(Math.min(96, Math.max(38, W*H/16000)));
    pts = [];
    for(var i=0;i<target;i++){
      pts.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vx: (Math.random()-0.5)*0.22,
        vy: (Math.random()-0.5)*0.22,
        r: Math.random()*1.5+0.6
      });
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var i,j,p,q,dx,dy,dist,lim = 132;

    for(i=0;i<pts.length;i++){
      p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x<-20) p.x=W+20; if(p.x>W+20) p.x=-20;
      if(p.y<-20) p.y=H+20; if(p.y>H+20) p.y=-20;

      /* 鼠标轻微排斥 */
      dx = p.x-mouse.x; dy = p.y-mouse.y;
      dist = Math.sqrt(dx*dx+dy*dy);
      if(dist < 110 && dist > 0.1){
        p.x += (dx/dist)*0.7;
        p.y += (dy/dist)*0.7;
      }

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,6.2832);
      ctx.fillStyle = 'rgba(150,232,255,'+(0.35+p.r*0.22)+')';
      ctx.fill();
    }

    for(i=0;i<pts.length;i++){
      p = pts[i];
      for(j=i+1;j<pts.length;j++){
        q = pts[j];
        dx = p.x-q.x; dy = p.y-q.y;
        dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < lim){
          ctx.beginPath();
          ctx.moveTo(p.x,p.y);
          ctx.lineTo(q.x,q.y);
          ctx.strokeStyle = 'rgba(34,211,238,'+(0.16*(1-dist/lim))+')';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(draw);
  }

  resize();
  if(!reduce){ draw(); } else {
    /* 静态一帧 */
    ctx.clearRect(0,0,W,H);
    for(var k=0;k<pts.length;k++){
      ctx.beginPath(); ctx.arc(pts[k].x,pts[k].y,pts[k].r,0,6.2832);
      ctx.fillStyle='rgba(150,232,255,.55)'; ctx.fill();
    }
  }

  window.addEventListener('resize', function(){
    cancelAnimationFrame(raf); resize();
    if(!reduce) draw();
  });
  window.addEventListener('mousemove', function(e){ mouse.x=e.clientX; mouse.y=e.clientY; });
  window.addEventListener('mouseleave', function(){ mouse.x=-9999; mouse.y=-9999; });

  /* 页面不可见时暂停，省电 */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ cancelAnimationFrame(raf); }
    else if(!reduce){ cancelAnimationFrame(raf); draw(); }
  });
})();
</script>
</body>
</html>
